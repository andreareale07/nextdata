[package]
name = "nd_engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = "thin"
opt-level = 3
strip = true
panic = "unwind"

[features]
# SMB e attivo nelle build di rilascio (pipeline: --features smb); la build locale senza la feature lo lascia disabilitato. Esiti del gate: docs/smb-gate.md.
smb = ["dep:smb"]

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
jni = "=0.21.1"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
ring = "0.17.14"
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
smb = { path = "vendor/smb", version = "=0.12.1", default-features = false, features = ["sign", "encrypt", "async"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"
webpki-roots = "1.0.12"
x509-parser = "0.18.1"
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
# Trascinamento verso Esplora file con file virtuali (OLE): src/dragout. La stessa versione e gia nel lock (da pageant/sspi).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# la macro #[implement] genera percorsi ::windows_core::
windows-core = "0.62.2"

[dev-dependencies]
tempfile = "3.27.0"
