name: Release

# Parte quando viene pubblicato un tag di versione: v0.1.0-beta.1, v1.0.0, ...
# I tag con suffisso (-beta.N, -rc.N) diventano pre-release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag di prova (es. v0.1.0-beta.1). Compila tutto ma NON pubblica la release."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- versione
  meta:
    name: Calcola versione
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}        # semver completo, es. 0.1.0-beta.1
      app_version: ${{ steps.v.outputs.app_version }} # numerico per MSI/Android, es. 0.1.0
      version_code: ${{ steps.v.outputs.version_code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Il tag '$TAG' non è un semver valido (vX.Y.Z[-suffisso])"; exit 1
          fi
          MAJ=${BASH_REMATCH[1]}; MIN=${BASH_REMATCH[2]}; PAT=${BASH_REMATCH[3]}; PRE=${BASH_REMATCH[4]}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$MAJ.$MIN.$PAT" >> "$GITHUB_OUTPUT"
          # versionCode monotono: cresce con la versione e con il numero di build
          echo "version_code=$(( MAJ*10000000 + MIN*100000 + PAT*1000 + (GITHUB_RUN_NUMBER % 1000) ))" >> "$GITHUB_OUTPUT"
          [ -n "$PRE" ] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ motore
  engine-windows:
    name: Engine · Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Test unitari
        working-directory: engine
        run: cargo test --lib --locked
      - name: Build (CRT statico, nessuna dipendenza da VC++ Redistributable)
        working-directory: engine
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows-x64
          path: engine/target/release/nd_engine.dll
          if-no-files-found: error

  engine-android:
    name: Engine · Android (arm64-v8a, armeabi-v7a, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Installa cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build (pagine da 16 KB)
        working-directory: engine
        env:
          # Android 15+ richiede librerie allineate a 16 KB
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o dist/android build --release --locked
          find dist/android -name '*.so' -exec ls -l {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: engine-android
          path: engine/dist/android
          if-no-files-found: error

  # ----------------------------------------------------------------- Windows
  desktop:
    name: App · Windows (EXE, MSI, ZIP portabile)
    needs: [meta, engine-windows]
    runs-on: windows-2022 # include WiX 3, necessario a jpackage per EXE/MSI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v8
        with:
          name: engine-windows-x64
          path: engine/dist/windows-x64
      - name: Test UI
        working-directory: app
        run: ./gradlew.bat :shared:allTests :desktopApp:test --no-daemon "-PappVersion=${{ needs.meta.outputs.app_version }}"
      - name: Pacchetti
        working-directory: app
        run: ./gradlew.bat :desktopApp:packageExe :desktopApp:packageMsi :desktopApp:createDistributable --no-daemon "-PappVersion=${{ needs.meta.outputs.app_version }}"
      - name: Rinomina e impacchetta
        shell: pwsh
        run: |
          $v = "${{ needs.meta.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          $bin = "app/desktopApp/build/compose/binaries/main"
          Copy-Item (Get-ChildItem "$bin/exe/*.exe").FullName "out/NextData-$v.exe"
          Copy-Item (Get-ChildItem "$bin/msi/*.msi").FullName "out/NextData-$v.msi"
          Compress-Archive -Path "$bin/app/NextData" -DestinationPath "out/NextData-$v-windows-portable.zip"
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: out/*
          if-no-files-found: error

  # ----------------------------------------------------------------- Android
  android:
    name: App · Android (APK, AAB)
    needs: [meta, engine-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v8
        with:
          name: engine-android
          path: engine/dist/android
      - name: Test UI
        working-directory: app
        run: ./gradlew :shared:allTests --no-daemon
      - name: Firma (se i segreti sono configurati)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Segreti di firma Android assenti: APK/AAB saranno NON firmati."
            exit 0
          fi
          mkdir -p app/.tmp
          echo "$KEYSTORE_B64" | base64 -d > app/.tmp/release.jks
          {
            echo "store=.tmp/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "alias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/.tmp/signing.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build release
        working-directory: app
        run: >
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon
          -PappVersion=${{ needs.meta.outputs.app_version }}
          -PappVersionCode=${{ needs.meta.outputs.version_code }}
      - name: Raccogli file
        run: |
          V="${{ needs.meta.outputs.version }}"
          SUFFIX=""; [ "${{ steps.sign.outputs.signed }}" = "true" ] || SUFFIX="-unsigned"
          mkdir -p out
          cp app/androidApp/build/outputs/apk/release/*.apk "out/NextData-$V$SUFFIX.apk"
          cp app/androidApp/build/outputs/bundle/release/*.aab "out/NextData-$V$SUFFIX.aab"
          ls -l out
      - name: Verifica firma APK
        if: steps.sign.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose out/*.apk
      - name: Rimuovi il keystore dal runner
        if: always()
        run: rm -rf app/.tmp
      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: out/*
          if-no-files-found: error

  # --------------------------------------------------------------- pubblica
  publish:
    name: Pubblica la release
    needs: [meta, desktop, android]
    # Il tag manuale (workflow_dispatch) serve solo a provare la build: non pubblica.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # crea la release
      id-token: write      # attestazione di provenienza
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-packages"
          merge-multiple: true
          path: release
      - name: Checksum
        working-directory: release
        run: |
          sha256sum NextData-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attestazione di provenienza
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/NextData-*"
      - name: Note di rilascio dal CHANGELOG
        id: notes
        run: |
          V="${{ needs.meta.outputs.version }}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Vedi la cronologia dei commit per i dettagli." > notes.md
          {
            echo
            echo "---"
            echo "**Verifica dei file:** \`sha256sum -c SHA256SUMS.txt\` · \`gh attestation verify <file> --repo ${{ github.repository }}\`"
          } >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: NextData ${{ needs.meta.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release/NextData-*
            release/SHA256SUMS.txt
