version: 2
updates:
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
