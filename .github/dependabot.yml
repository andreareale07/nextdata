version: 2
updates:
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Il bridge JNI usa l'API 0.21: la 0.22 non compila senza migrazione dedicata.
      - dependency-name: jni
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: gradle
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
